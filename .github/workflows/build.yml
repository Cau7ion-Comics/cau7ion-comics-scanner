
name: Clean Cau7ion Installation Test

on:
  push:
    branches:
      - installation-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create clean Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/cau7ion/cleantest

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Cau7ionCleanTest'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.cau7ion.cleantest'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.cau7ion.cleantest'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Cau7ion Clean Test"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/cau7ion/cleantest/MainActivity.java <<'EOF'
          package com.cau7ion.cleantest;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          import android.view.Gravity;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  TextView text = new TextView(this);
                  text.setText("Cau7ion Comics Scanner\nClean Installation Test");
                  text.setTextSize(22);
                  text.setGravity(Gravity.CENTER);
                  setContentView(text);
              }
          }
          EOF

      - name: Build clean APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload clean APK
        uses: actions/upload-artifact@v4
        with:
          name: Cau7ion-Clean-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
